name: Publicar LR Vetor v0.31.0
on:
  push:
    paths:
      - '.github/workflows/publish-v0.31.0.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar artefato validado
        run: |
          curl -L --fail --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-51c8-820e-841d-68460709828b/raw?se=2026-09-26T01%3A24%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=54d4416f-0dd3-5b86-8120-3f18079c0bbf&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T19%3A55%3A30Z&ske=2026-09-26T19%3A55%3A30Z&sks=b&skv=2026-02-06&sig=00x/sWMaXf%2BBTOl5xGh2QOSFTYRs%2B1uRE2cGxFTjYoQ%3D' -o lr-vetor.zip
          unzip -o lr-vetor.zip -d package
          find package -type f -maxdepth 3 -print
          cp "$(find package -type f -name 'LR-Vetor-Windows-Setup.exe' | head -n1)" LR-Vetor-Windows-Setup.exe
          echo "89804a6c6ee179a3a516699a81688d3b09e14f4c0c0af959ce39e2ffa93f1356  LR-Vetor-Windows-Setup.exe" | sha256sum -c -
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.31.0 --repo flavianoresendemachado-lgtm/LR-Vetor-Downloads >/dev/null 2>&1 || gh release create v0.31.0 --repo flavianoresendemachado-lgtm/LR-Vetor-Downloads --title "LR Vetor v0.31.0" --notes "Versão de teste com refinamento Segóvia, escala/cavalete técnicos, Biblioteca de Projetos e Desfazer/Refazer." --latest
          gh release upload v0.31.0 LR-Vetor-Windows-Setup.exe --repo flavianoresendemachado-lgtm/LR-Vetor-Downloads --clobber
