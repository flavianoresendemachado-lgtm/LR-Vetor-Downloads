name: Publicar LR Vetor v0.32.0
on:
  push:
    paths:
      - '.github/workflows/publish-v0.32.0.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar artefato validado
        run: |
          curl -L --fail --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-990c-820e-8ab8-b46685e99cbd/raw?se=2026-09-26T02%3A50%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=e835b2a0-a4b0-5900-a352-0fe08ed76dbe&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T19%3A37%3A59Z&ske=2026-09-26T19%3A37%3A59Z&sks=b&skv=2026-02-06&sig=a3cOX80ZWEUoAlWBLDWUKD7B6qNeh4Fre54F8pJvJ9c%3D' -o lr-vetor.zip
          unzip -o lr-vetor.zip -d package
          cp "$(find package -type f -name 'LR-Vetor-Windows-Setup.exe' | head -n1)" LR-Vetor-Windows-Setup.exe
          echo "a3c076afc0b754b932bf71cf80a0203286d1465e051c4fce12983332db4276ee  LR-Vetor-Windows-Setup.exe" | sha256sum -c -
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.32.0 --repo flavianoresendemachado-lgtm/LR-Vetor-Downloads >/dev/null 2>&1 || gh release create v0.32.0 --repo flavianoresendemachado-lgtm/LR-Vetor-Downloads --title "LR Vetor v0.32.0" --notes "Segovia refinada, zoom de precisão, múltiplas fotos, mouse simplificado, fim de escala e Estúdio 3D WebGL." --latest
          gh release upload v0.32.0 LR-Vetor-Windows-Setup.exe --repo flavianoresendemachado-lgtm/LR-Vetor-Downloads --clobber
