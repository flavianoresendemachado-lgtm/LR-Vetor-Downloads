name: Publicar LR Vetor v0.33.3
on:
  push:
    paths:
      - '.github/workflows/publish-v0.33.3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar artefato validado
        run: |
          curl -L --fail --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-8670-820e-83b4-86c58a3b6625/raw?se=2026-09-26T05%3A22%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=12bf05d6-11d4-5406-9955-44b1c0a0a09e&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T19%3A45%3A31Z&ske=2026-09-26T19%3A45%3A31Z&sks=b&skv=2026-02-06&sig=pn3MRuvkbqHQEq2g%2B9CTBCgKroDlpqR6rQ6zynY%2BUAU%3D' -o lr-vetor.zip
          unzip -o lr-vetor.zip -d package
          cp "$(find package -type f -name 'LR-Vetor-Windows-Setup.exe' | head -n1)" LR-Vetor-Windows-Setup.exe
          echo "68baab05cfd365b839289f4847508f1142e3f91ae91389d181b6bebb35bf0b11  LR-Vetor-Windows-Setup.exe" | sha256sum -c -
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.33.3 --repo flavianoresendemachado-lgtm/LR-Vetor-Downloads >/dev/null 2>&1 || gh release create v0.33.3 --repo flavianoresendemachado-lgtm/LR-Vetor-Downloads --title "LR Vetor v0.33.3" --notes "Molde Mestre Bézier suavizado, forma fixa com tamanho proporcional, cavalete reto 180x30 mm, salto 3D, shape C/D do braço, pan pelo mouse e correções gerais do 3D." --latest
          gh release upload v0.33.3 LR-Vetor-Windows-Setup.exe --repo flavianoresendemachado-lgtm/LR-Vetor-Downloads --clobber
