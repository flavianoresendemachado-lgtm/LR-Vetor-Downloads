name: Publicar LR Vetor v0.34.0
on:
  push:
    paths:
      - '.github/workflows/publish-v0.34.0.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar artefato validado
        run: |
          curl -L --fail --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-77fc-820e-9116-ea1cae77eb13/raw?se=2026-09-26T12%3A38%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=5c26cdb7-6925-5afe-bb83-5e2c2d5bc610&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T11%3A58%3A10Z&ske=2026-09-27T11%3A58%3A10Z&sks=b&skv=2026-02-06&sig=XjI7uaZttFQDTxi8eGMdzkgk5T4oeCiA%2BRkGiTDSl9o%3D' -o lr-vetor.zip
          unzip -o lr-vetor.zip -d package
          cp "$(find package -type f -name 'LR-Vetor-Windows-Setup.exe' | head -n1)" LR-Vetor-Windows-Setup.exe
          echo "444e6d8bc7722bea1bc54d4b699f828282236ba6d176c6b0ce14868caff6cdb2  LR-Vetor-Windows-Setup.exe" | sha256sum -c -
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.34.0 --repo flavianoresendemachado-lgtm/LR-Vetor-Downloads >/dev/null 2>&1 || gh release create v0.34.0 --repo flavianoresendemachado-lgtm/LR-Vetor-Downloads --title "LR Vetor v0.34.0" --notes "Atualização v0.34.0 validada no Build #143: novas ferramentas de matriz, medição direta em mm, ajustes 3D e correções gerais." --latest
          gh release upload v0.34.0 LR-Vetor-Windows-Setup.exe --repo flavianoresendemachado-lgtm/LR-Vetor-Downloads --clobber
