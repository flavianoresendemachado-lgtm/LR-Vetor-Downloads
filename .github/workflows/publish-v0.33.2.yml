name: Publicar LR Vetor v0.33.2
on:
  push:
    paths:
      - '.github/workflows/publish-v0.33.2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar artefato validado
        run: |
          curl -L --fail --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-6430-820e-8a24-854b3d18afc2/raw?se=2026-09-26T04%3A40%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=b36b7ed0-a60b-5bdc-be68-f4275674b218&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T03%3A31%3A58Z&ske=2026-09-27T03%3A31%3A58Z&sks=b&skv=2026-02-06&sig=EMtpiOYlsE41kIjH3Nwi3Xd354E8Hg2SNPtD8jSpgcI%3D' -o lr-vetor.zip
          unzip -o lr-vetor.zip -d package
          cp "$(find package -type f -name 'LR-Vetor-Windows-Setup.exe' | head -n1)" LR-Vetor-Windows-Setup.exe
          echo "9e3351c41becb2f4e4666b60e5fdfd2425f6fd62e305764c47c405bb547ef6cc  LR-Vetor-Windows-Setup.exe" | sha256sum -c -
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.33.2 --repo flavianoresendemachado-lgtm/LR-Vetor-Downloads >/dev/null 2>&1 || gh release create v0.33.2 --repo flavianoresendemachado-lgtm/LR-Vetor-Downloads --title "LR Vetor v0.33.2" --notes "Correções do 3D real: abertura pelo botão Visualizar em 3D, junção braço/caixa, roseta, final da escala e reposicionamento da montagem." --latest
          gh release upload v0.33.2 LR-Vetor-Windows-Setup.exe --repo flavianoresendemachado-lgtm/LR-Vetor-Downloads --clobber
