name: Publicar LR Vetor v0.33.1
on:
  push:
    paths:
      - '.github/workflows/publish-v0.33.1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar artefato validado
        run: |
          curl -L --fail --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-03d4-820e-ac11-d0fa6d4af2ba/raw?se=2026-09-26T04%3A20%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=e6f9bab1-8b3b-5b31-b99e-c61bbac86970&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T19%3A38%3A21Z&ske=2026-09-26T19%3A38%3A21Z&sks=b&skv=2026-02-06&sig=B/7gkCsOsqHIKx3fGlVTiUXPhEW8o3UCTfTF8omYEI0%3D' -o lr-vetor.zip
          unzip -o lr-vetor.zip -d package
          cp "$(find package -type f -name 'LR-Vetor-Windows-Setup.exe' | head -n1)" LR-Vetor-Windows-Setup.exe
          echo "10b8380a43d97987db51d7657b4905df7777452ec4c13ab15663cad1c9b3ff61  LR-Vetor-Windows-Setup.exe" | sha256sum -c -
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.33.1 --repo flavianoresendemachado-lgtm/LR-Vetor-Downloads >/dev/null 2>&1 || gh release create v0.33.1 --repo flavianoresendemachado-lgtm/LR-Vetor-Downloads --title "LR Vetor v0.33.1" --notes "Teste do Molde Mestre Segovia proporcional por altura, com melhorias 3D e correções acumuladas." --latest
          gh release upload v0.33.1 LR-Vetor-Windows-Setup.exe --repo flavianoresendemachado-lgtm/LR-Vetor-Downloads --clobber
